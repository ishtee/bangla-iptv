name: Update Bangladesh playlist

on:
  schedule:
    - cron: "40 10 * * *"  # daily, 10:40 UTC = 9:40pm Melbourne (AEDT)
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Build playlist and EPG
        run: |
          python build_bd_playlist.py
          sed -i "s#https://YOUR-HOST/epg.xml#https://raw.githubusercontent.com/${{ github.repository }}/main/epg.xml#" bangladesh.m3u

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add bangladesh.m3u epg.xml
          git diff --staged --quiet || (git commit -m "Update playlist" && git push)
